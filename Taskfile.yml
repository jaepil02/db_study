# db_study 작업 정의 — 정본 docs/09_tech_stack/05_tooling_devops.md §Taskfile 작업
# 작업: migrate · seed · docs:lint + 보조 api-build · up · test-surface — 기동 순서(04_architecture/03): 저장소 healthy → migrate → seed(빈 볼륨) → api healthy.
# 스냅샷 · 복원 · 측정 실행 작업과 대조 자원 오버레이는 D-16(2026-10-11)에서 측정 도구와 함께 삭제했다.
version: '3'

# 비밀은 .env에서 읽어 명령 환경으로만 넘긴다 — migrate가 관리자 · app_owner 비밀번호를 쓴다(12_security/02)
dotenv: ['.env']

vars:
  PROJECT: db_study
  STORES: postgres clickhouse redis
  COMPOSE: docker compose --env-file .env -f infra/compose/compose.yml
  # 메모리 프로파일 — load(기본) · dev · mid. 덮어쓰기 파일 하나가 상한 · MEMORY_PROFILE · 워커 수를 함께 준다(09_tech_stack/04)
  PROFILE: '{{.PROFILE | default "load"}}'
  COMPOSE_P: '{{.COMPOSE}} -f infra/compose/compose.{{.PROFILE}}.yml'
  HEALTH_TIMEOUT: 120
  # 이미지에 들어가는 것 전부가 커밋돼 있을 때만 커밋 해시를 빌드 인자로 준다 — 아니면 null(그 기동의 측정은 인용 불가)
  CLEAN_HASH:
    sh: 'if [ -z "$(git status --porcelain -- apps packages infra/postgres/migrations infra/clickhouse/ddl package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json .dockerignore)" ]; then git rev-parse --short HEAD; fi'

tasks:
  wait-healthy:
    internal: true
    cmds:
      - |
        # Task의 셸 인터프리터는 루프 본문 끝의 실패한 && 목록에서 스크립트를 끝낸다 — 판정은 if로만 쓴다
        deadline=$(( $(date +%s) + {{.HEALTH_TIMEOUT}} ))
        while :; do
          ok=0
          for s in {{.STORES}}; do
            st=$(docker inspect -f '{{"{{"}}.State.Health.Status{{"}}"}}' "{{.PROJECT}}-$s-1" 2>/dev/null || true)
            if [ "$st" = healthy ]; then ok=$((ok+1)); fi
          done
          if [ "$ok" -eq 3 ]; then echo "저장소 3개 healthy"; break; fi
          if [ "$(date +%s)" -ge "$deadline" ]; then echo "healthy 대기 {{.HEALTH_TIMEOUT}}초 초과" >&2; exit 1; fi
          sleep 2
        done

  api-build:
    desc: api 이미지 빌드 — 작업 트리가 깨끗하면 커밋 해시를 빌드 인자로(health run.commitHash) · 아니면 null
    cmds:
      - 'COMMIT_HASH={{.CLEAN_HASH}} {{.COMPOSE_P}} build api'
      - 'echo "api 이미지 — COMMIT_HASH={{if .CLEAN_HASH}}{{.CLEAN_HASH}}{{else}}(null · 미커밋 변경 있음){{end}}"'

  migrate:
    desc: PostgreSQL 순번 마이그레이션 → ClickHouse DDL 순번(멱등) — 저장소 3 healthy 뒤
    deps: [api-build]
    cmds:
      - >-
        COMMIT_HASH={{.CLEAN_HASH}} {{.COMPOSE_P}} run --rm --no-deps
        -e POSTGRES_ADMIN_PASSWORD -e APP_OWNER_PASSWORD -e APP_RW_PASSWORD -e CH_READER_PASSWORD
        api node dist/db/migrate.js

  seed:
    desc: '마스터 시드 — 빈 볼륨 전용 · 사용: task seed(카드 라인 30대 · 로컬 기본) · task seed -- --slice s2(시험용 설비 1)'
    cmds:
      - 'COMMIT_HASH={{.CLEAN_HASH}} {{.COMPOSE_P}} run --rm --no-deps api node dist/db/seed.js {{.CLI_ARGS}}'

  up:
    desc: '전 구성 기동 — 저장소 → migrate → (SEED가 있으면 seed) → api healthy · 사용: task up [PROFILE=load] [SEED="--card-line"](빈 볼륨 첫 기동만 · 로컬 기본 시드)'
    # 명령줄 변수(task up PROFILE=dev)는 전역 vars 평가에 들어가지 않는다(Task 3.53 실측) — 작업 수준에서 다시 만든다
    vars:
      COMPOSE_P: '{{.COMPOSE}} -f infra/compose/compose.{{.PROFILE}}.yml'
    cmds:
      - '{{.COMPOSE_P}} up -d postgres clickhouse redis'
      - task: wait-healthy
      - task: migrate
      - |
        {{if .SEED}}COMMIT_HASH={{.CLEAN_HASH}} {{.COMPOSE_P}} run --rm --no-deps api node dist/db/seed.js {{.SEED}}{{else}}echo "seed 생략 — SEED 없음"{{end}}
      - 'COMMIT_HASH={{.CLEAN_HASH}} {{.COMPOSE_P}} up -d --no-deps api'
      - task: wait-api

  wait-api:
    internal: true
    cmds:
      - |
        deadline=$(( $(date +%s) + {{.HEALTH_TIMEOUT}} ))
        while :; do
          st=$(docker inspect -f '{{"{{"}}.State.Health.Status{{"}}"}}' "{{.PROJECT}}-api-1" 2>/dev/null || true)
          if [ "$st" = healthy ]; then echo "api healthy"; break; fi
          if [ "$(date +%s)" -ge "$deadline" ]; then echo "api healthy 대기 {{.HEALTH_TIMEOUT}}초 초과" >&2; exit 1; fi
          sleep 2
        done

  test-surface:
    desc: 표면 계약 테스트 — 떠 있는 api(127.0.0.1:13000)에 블랙박스로 붙는다(task up 뒤 · test/surface*.test.ts 전부)
    cmds:
      - SURFACE_BASE_URL=http://127.0.0.1:13000 pnpm --filter @db-study/api exec vitest run test/surface

  docs:lint:
    desc: 문서군 기계 검사(읽기 전용) — 인자는 task docs:lint -- --final 처럼 넘긴다
    cmds:
      - python3 scripts/docs_lint.py {{.CLI_ARGS}}
