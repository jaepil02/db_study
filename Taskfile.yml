# db_study 작업 정의 — 정본 docs/09_tech_stack/05_tooling_devops.md §Taskfile 작업
# 작업 6(migrate · seed · snapshot · restore · bench · docs:lint) 중 S0 배정분 3개만 둔다.
# migrate · seed(S3) · bench(S5)는 그 단계에서 더한다(docs/01_overview/05_priorities_roadmap.md §코드 착수 항목).
version: '3'

vars:
  PROJECT: db_study
  # 네 볼륨은 한 몸이다 — 스냅샷 · 복원은 항상 함께 한다(05_data_stores/09 §스냅샷과의 관계)
  VOLUMES: pgdata chdata redisdata spooldata
  STORES: postgres clickhouse redis
  # 볼륨 보관 도구 — 버전 고정표에 이미 있는 태그 고정 이미지를 쓴다(busybox tar) · 소유자 번호는 --numeric-owner로 보존한다
  TAR_IMAGE: postgres:18.6-alpine
  COMPOSE: docker compose --env-file .env -f infra/compose/compose.yml
  HEALTH_TIMEOUT: 120

tasks:
  snapshot:
    desc: 컨테이너 정지 → 볼륨 4개를 snapshots/NAME/ 아래 볼륨별 tar.gz로 묶는다(재기동은 사람이)
    summary: |
      사용: task snapshot NAME=<이름>
      같은 이름이 있으면 거부한다. 아직 없는 볼륨(예: api 이전의 spooldata)은 manifest에 absent로 적고 건너뛴다.
      실행 중 볼륨을 묶지 않는다 — 파트 · WAL이 중간 상태로 묶인다(04_architecture/03 §스냅샷과 복원).
    requires:
      vars: [NAME]
    preconditions:
      - sh: '[ ! -e "snapshots/{{.NAME}}" ]'
        msg: 'snapshots/{{.NAME}} 이 이미 있다 — 같은 이름의 스냅샷은 거부한다'
    cmds:
      - mkdir -p "snapshots/{{.NAME}}"
      - |
        {
          echo "name={{.NAME}}"
          echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "git_commit=$(git rev-parse --short HEAD)"
          echo "git_dirty=$(git status --porcelain --untracked-files=no | grep -q . && echo yes || echo no)"
          for s in {{.STORES}}; do
            c="{{.PROJECT}}-$s-1"
            if docker inspect "$c" >/dev/null 2>&1; then
              echo "container.$s=$(docker inspect -f '{{"{{"}}.Config.Image{{"}}"}} mem={{"{{"}}.HostConfig.Memory{{"}}"}} cpuset={{"{{"}}.HostConfig.CpusetCpus{{"}}"}}' "$c")"
            else
              echo "container.$s=absent"
            fi
          done
        } > "snapshots/{{.NAME}}/manifest.txt"
      - '{{.COMPOSE}} stop'
      - |
        for v in {{.VOLUMES}}; do
          vol="{{.PROJECT}}_$v"
          if docker volume inspect "$vol" >/dev/null 2>&1; then
            docker run --rm -v "$vol":/v:ro -v "$PWD/snapshots/{{.NAME}}":/out {{.TAR_IMAGE}} \
              tar --numeric-owner -C /v -czf "/out/$v.tar.gz" .
            echo "volume.$v=archived $(du -h "snapshots/{{.NAME}}/$v.tar.gz" | cut -f1)" | tee -a "snapshots/{{.NAME}}/manifest.txt"
          else
            echo "volume.$v=absent" | tee -a "snapshots/{{.NAME}}/manifest.txt"
          fi
        done
      - echo "스냅샷 완료 — 컨테이너는 정지 상태다. 재기동은 {{.COMPOSE}} start"

  restore:
    desc: 컨테이너 정지 → 볼륨 비우기 → snapshots/NAME/ 아카이브 역전개 → 재기동 · healthy 대기
    summary: |
      사용: task restore NAME=<이름>
      아카이브에 있는 볼륨은 되돌리고, 스냅샷 때 없던 볼륨(manifest absent)은 비운다. 복원 전 현재 상태가 필요하면 snapshot을 먼저 뜬다.
    requires:
      vars: [NAME]
    preconditions:
      - sh: 'ls snapshots/{{.NAME}}/*.tar.gz >/dev/null 2>&1'
        msg: 'snapshots/{{.NAME}} 에 볼륨 아카이브가 없다'
    cmds:
      - '{{.COMPOSE}} stop'
      - |
        for f in snapshots/{{.NAME}}/*.tar.gz; do
          v=$(basename "$f" .tar.gz)
          vol="{{.PROJECT}}_$v"
          if ! docker volume inspect "$vol" >/dev/null 2>&1; then
            docker volume create --label com.docker.compose.project={{.PROJECT}} \
              --label com.docker.compose.volume="$v" "$vol" >/dev/null
          fi
          docker run --rm -v "$vol":/v -v "$PWD/snapshots/{{.NAME}}":/in:ro {{.TAR_IMAGE}} \
            sh -c "find /v -mindepth 1 -delete && tar --numeric-owner -C /v -xzpf /in/$v.tar.gz"
          echo "restored $v"
        done
        # 스냅샷 때 없던 볼륨(manifest absent)은 비운다 — 네 볼륨이 한 시점이어야 한다(05_data_stores/09)
        for v in $(sed -n 's/^volume\.\(.*\)=absent$/\1/p' snapshots/{{.NAME}}/manifest.txt); do
          vol="{{.PROJECT}}_$v"
          if docker volume inspect "$vol" >/dev/null 2>&1; then
            docker run --rm -v "$vol":/v {{.TAR_IMAGE}} find /v -mindepth 1 -delete
            echo "emptied $v (absent in snapshot)"
          fi
        done
      - '{{.COMPOSE}} start'
      - task: wait-healthy

  wait-healthy:
    internal: true
    cmds:
      - |
        # Task의 셸 인터프리터는 루프 본문 끝의 실패한 && 목록에서 스크립트를 끝낸다 — 판정은 if로만 쓴다
        deadline=$(( $(date +%s) + {{.HEALTH_TIMEOUT}} ))
        while :; do
          ok=0
          for s in {{.STORES}}; do
            st=$(docker inspect -f '{{"{{"}}.State.Health.Status{{"}}"}}' "{{.PROJECT}}-$s-1" 2>/dev/null || true)
            if [ "$st" = healthy ]; then ok=$((ok+1)); fi
          done
          if [ "$ok" -eq 3 ]; then echo "저장소 3개 healthy"; break; fi
          if [ "$(date +%s)" -ge "$deadline" ]; then echo "healthy 대기 {{.HEALTH_TIMEOUT}}초 초과" >&2; exit 1; fi
          sleep 2
        done

  docs:lint:
    desc: 문서군 기계 검사(읽기 전용) — 인자는 task docs:lint -- --final 처럼 넘긴다
    cmds:
      - python3 scripts/docs_lint.py {{.CLI_ARGS}}
