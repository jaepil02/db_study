# 중간 프로파일(조건부) — Docker 10 GB · 부하 실험 프로파일을 쓸 수 없을 때만 · 원본 목표와 비교하지 않는다
# maxmemory 여유가 작아 volatile-lru 축출 연쇄가 기본 구성에서 자연 발생한다
# 정본: docs/09_tech_stack/04_local_environment.md §컨테이너 메모리 상한 · docs/05_data_stores/06_redis_memory.md
services:
  postgres:
    mem_limit: 1536m
    volumes:
      - ../postgres/profile-mid.conf:/etc/postgresql/profile.conf:ro

  clickhouse:
    mem_limit: 4g

  redis:
    mem_limit: 2g
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 필요}
      - --maxmemory
      - 1536mb

  api:
    mem_limit: 2g
    environment:
      MEMORY_PROFILE: mid
      WORKER_POOL_SIZE: "2"
      # V8 힙 상한은 컨테이너 상한보다 낮게 — OOM Killer보다 GC 압박이 먼저 신호를 낸다(04_architecture/03)
      NODE_OPTIONS: --max-old-space-size=1536
      UV_THREADPOOL_SIZE: "8"
