# 부하 실험 프로파일 — Docker 12 GB 이상 · 성능 측정 전용(기본 프로파일)
# 정본: docs/09_tech_stack/04_local_environment.md §컨테이너 메모리 상한 · docs/05_data_stores/06_redis_memory.md
services:
  postgres:
    mem_limit: 2g
    volumes:
      - ../postgres/profile-load.conf:/etc/postgresql/profile.conf:ro

  clickhouse:
    mem_limit: 5g

  redis:
    mem_limit: 2560m
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 필요}
      - --maxmemory
      - 2gb

  api:
    mem_limit: 2g
    environment:
      MEMORY_PROFILE: load
      WORKER_POOL_SIZE: "2"
      # V8 힙 상한은 컨테이너 상한보다 낮게 — OOM Killer보다 GC 압박이 먼저 신호를 낸다(04_architecture/03)
      NODE_OPTIONS: --max-old-space-size=1536
      UV_THREADPOOL_SIZE: "8"

  # 생성기 전용 프로세스(profile datagen) — MAXLEN(적체 임계의 분모)이 프로파일에서 나온다 · 메모리 상한은 프로파일 표 밖(04_architecture/03 잠정 배치)
  datagen:
    environment:
      MEMORY_PROFILE: load
      WORKER_POOL_SIZE: "2"
