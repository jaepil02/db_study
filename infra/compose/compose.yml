# db_study 기본 정의 — 저장소 3개(S0) + api 1(S2) · 웹은 호스트 프로세스(Compose 밖)
# 정본: docs/04_architecture/03_execution_topology.md(서비스 · 포트 · 볼륨 · CPU 가중 · cpuset)
#       docs/09_tech_stack/03_data_infra.md(버전 고정표 · 설정 파일 · healthcheck)
# 프로파일(메모리 상한 · 프로파일별 설정)은 덮어쓰기 파일 하나로 고른다:
#   docker compose --env-file .env -f infra/compose/compose.yml -f infra/compose/compose.dev.yml up -d
name: db_study

services:
  postgres:
    # 파생 이미지 — 공식 18.6-alpine + pg_partman(S3 · 버전 고정표) · infra/postgres/Dockerfile
    build:
      context: ../postgres
      args:
        PG_PARTMAN_VERSION: "5.5.0"
    image: db_study-postgres:18.6-partman5.5.0
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD 필요}
      POSTGRES_DB: plc
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    # pg_isready는 인증하지 않는다 — 애플리케이션 계정(app_rw)은 migrate가 만들지만 그 전에도 이 확인은 성립한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_rw -d plc"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpu_shares: 1024
    cpuset: "9-10"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.10.6
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD 필요}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # dict_tag 소스 계정 비밀번호 — 설정 파일(named collection pg_dict)이 from_env로 읽는다 · DDL에 쓰지 않는다(12_security/02)
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?CH_READER_PASSWORD 필요}
    volumes:
      - chdata:/var/lib/clickhouse
      - ../clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ../clickhouse/config.d/server.xml:/etc/clickhouse-server/config.d/server.xml:ro
      - ../clickhouse/config.d/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
      - ../clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ../clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9363:9363"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    cpu_shares: 2048
    cpuset: "5-8"

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # 비밀번호는 설정 파일이 아니라 기동 인자로 주입한다 · maxmemory는 프로파일 덮어쓰기 파일이 command 전체로 준다
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 필요}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      # 호스트 쪽만 6380 — 이 머신의 호스트 redis-server가 6379를 쓴다(충돌 시 호스트 포트만 바꾼다 · 04_architecture/03)
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpu_shares: 512
    cpuset: "0-4"

  api:
    # 로컬 빌드 — 커밋 해시는 빌드 인자로만 준다(09_tech_stack/04 · task up이 git 해시를 넘긴다)
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-}
    image: db_study-api:${COMMIT_HASH:-dev}
    restart: unless-stopped
    environment:
      APP_ROLE: ${APP_ROLE:-all}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL 필요}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL 필요}
      REDIS_URL: ${REDIS_URL:?REDIS_URL 필요}
      REDIS_STREAM_BUFFER: ${REDIS_STREAM_BUFFER:-on}
      REDIS_LATEST_CACHE: ${REDIS_LATEST_CACHE:-on}
      REDIS_QUERY_CACHE: ${REDIS_QUERY_CACHE:-on}
      CACHE_KEY_TIME_SNAP: ${CACHE_KEY_TIME_SNAP:-on}
      CACHE_STAMPEDE_LOCK: ${CACHE_STAMPEDE_LOCK:-on}
      REDIS_PUBSUB_FANOUT: ${REDIS_PUBSUB_FANOUT:-on}
      WS_THROTTLE_MS: ${WS_THROTTLE_MS:-100}
      INGEST_IDEMPOTENCY: ${INGEST_IDEMPOTENCY:-on}
      CONTROL_TABLE_ENABLED: ${CONTROL_TABLE_ENABLED:-off}
      COLLECTOR_DEADBAND: ${COLLECTOR_DEADBAND:-off}
      LATEST_VALUE_WRITER: ${LATEST_VALUE_WRITER:-ingest}
      # SW-12 — 업무 쓰기 경로(stream 기본 · direct는 EXP-46 비교용 옛 경로 · 02_features/13)
      BIZ_WRITE_PATH: ${BIZ_WRITE_PATH:-stream}
      CAPACITY_TIER: ${CAPACITY_TIER:-}
      # S3 — 배치 안(ADR-09 · EXP-34) · 모드 A 신호 프로파일 · SIM 주입 계획 경로(컨테이너 안) · 실험 전용 결함 주입(비우면 비활성)
      INGEST_BATCH_PLAN: ${INGEST_BATCH_PLAN:-A}
      GEN_PROFILE: ${GEN_PROFILE:-SINE}
      SIM_FAULT_PLAN: ${SIM_FAULT_PLAN:-}
      # 인증 전 알람 확인 행위자(09_tech_stack/04 · 07_api/07 §인증 전 확인 행위자 판정) — 기본 없음 · 없으면 확인만 401
      ALARM_ACK_ACTOR_EMAIL: ${ALARM_ACK_ACTOR_EMAIL:-}
      INGEST_LAB_FAULT: ${INGEST_LAB_FAULT:-}
      # S5 — 모드 C 부하 주입 표면 게이트(스위치가 아님 · 07_api/09 · 기본 false · true면 기동 경고 1줄)
      DATAGEN_BULK_ENABLED: ${DATAGEN_BULK_ENABLED:-false}
      TZ: Asia/Seoul
      # MEMORY_PROFILE · WORKER_POOL_SIZE · NODE_OPTIONS · UV_THREADPOOL_SIZE는 프로파일 덮어쓰기 파일이 준다 — 상한과 이름이 한 파일에서 나온다
    volumes:
      - spooldata:/app/spool
      - ../sim-plans:/app/sim-plans:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 관계식 — timeout 3초 > health 저장소 타임아웃 1,000 ms(병렬) · 정본 09_tech_stack/03 §Compose healthcheck와 health 타임아웃
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    cpu_shares: 1536
    cpuset: "0-4"

  # 생성기 전용 프로세스(APP_ROLE=datagen · 모드 B — S3 당김) — 측정 대상과 CPU를 나누지 않게 11-12(k6 공유 · 04_architecture/03 잠정 행)
  # up에 포함되지 않는다(profile datagen) — 실험 러너가 run으로만 부른다: docker compose --profile datagen run --rm datagen node dist/mode-b.js …
  datagen:
    profiles: ["datagen"]
    image: db_study-api:${COMMIT_HASH:-dev}
    environment:
      APP_ROLE: datagen
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL 필요}
      REDIS_URL: ${REDIS_URL:?REDIS_URL 필요}
      # 스위치 11 — api와 같은 값을 받는다: 모드 B 출력의 switches가 측정 기록 4요소이고 조합 제약 #2 · #8 · #9 검사가 이 값을 본다(검수 D3)
      REDIS_STREAM_BUFFER: ${REDIS_STREAM_BUFFER:-on}
      REDIS_LATEST_CACHE: ${REDIS_LATEST_CACHE:-on}
      REDIS_QUERY_CACHE: ${REDIS_QUERY_CACHE:-on}
      CACHE_KEY_TIME_SNAP: ${CACHE_KEY_TIME_SNAP:-on}
      CACHE_STAMPEDE_LOCK: ${CACHE_STAMPEDE_LOCK:-on}
      REDIS_PUBSUB_FANOUT: ${REDIS_PUBSUB_FANOUT:-on}
      WS_THROTTLE_MS: ${WS_THROTTLE_MS:-100}
      INGEST_IDEMPOTENCY: ${INGEST_IDEMPOTENCY:-on}
      CONTROL_TABLE_ENABLED: ${CONTROL_TABLE_ENABLED:-off}
      COLLECTOR_DEADBAND: ${COLLECTOR_DEADBAND:-off}
      LATEST_VALUE_WRITER: ${LATEST_VALUE_WRITER:-ingest}
      INGEST_BATCH_PLAN: ${INGEST_BATCH_PLAN:-A}
      CAPACITY_TIER: ${CAPACITY_TIER:-}
      GEN_PROFILE: ${GEN_PROFILE:-SINE}
      TZ: Asia/Seoul
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    cpu_shares: 512
    cpuset: "11-12"

  # 모드 D(GEN-08 · GEN-10 · S5) 전용 — datagen과 같은 이미지 · 환경에 ClickHouse 접속과 app_owner 비밀번호만 더한다.
  # app_owner(DDL 소유자) 비밀은 과거 일 파티션 생성 · ⑧ 비우기 · 대조군 정리에만 쓴다 — 모드 B가 도는 datagen에는 싣지 않는다(최소 권한 · 12_security/02).
  # 격자 러너가 run으로만 부른다: docker compose --profile datagen-d run --rm --no-deps datagen-d node dist/mode-d.js …
  datagen-d:
    extends:
      service: datagen
    # extends는 profiles를 합친다 — !override로 datagen 프로파일에서 빼 owner 비밀이 --profile datagen up에 딸려 뜨지 않게 한다(검수 N1)
    profiles: !override ["datagen-d"]
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL 필요}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?APP_OWNER_PASSWORD 필요}

  # 역방향 대조 실행기(EXP-40~44 · S5) 전용 — datagen과 같은 이미지 · 환경에 ClickHouse 접속만 더한다(app_owner 비밀은 싣지 않는다 · 업무 테이블 쓰기는 app_rw 권한 안).
  # 측정 경로에 앱이 끼지 않게 도구 CPU 11-12에서 저장소에 직접 붙는다(05_data_stores/10 §실험의 모양 측정 경로 행).
  # 오케스트레이터가 run으로만 부른다: docker compose --profile oltp-lab run --rm --no-deps oltp-lab node dist/oltp-lab.js …
  oltp-lab:
    extends:
      service: datagen
    profiles: !override ["oltp-lab"]
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL 필요}

  # 관측 스택(observability 프로파일 · S5) — 구성원 prometheus · grafana 2(09_tech_stack/03 · ADR-20) · 기본 기동에 포함되지 않는다
  # 정밀 측정 세션은 이 프로파일을 끈다(10_observability/03 §관측 부하 규칙) · CPU 13(측정 대상 · 부하 도구 밖 — 04_architecture/03)
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # k6 원격 쓰기 수신(10_observability/03 §관측 부하 규칙 — 탐색 세션만)
      - --web.enable-remote-write-receiver
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m
    cpuset: "13"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.11
    restart: "no"
    # 비밀번호가 비면 기동을 거부한다 — 검사를 compose 치환(:?)에 두면 프로파일 밖 명령까지 전부 막힌다
    entrypoint: ["sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'GRAFANA_ADMIN_PASSWORD 필요(.env)' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 대시보드 새로고침 하한을 서버에서 강제 — 스크레이프 주기보다 짧게 두지 않는다(10_observability/03 §관측 부하 규칙)
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 15s
      TZ: Asia/Seoul
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
    mem_limit: 512m
    cpuset: "13"

volumes:
  pgdata:
  chdata:
  redisdata:
  spooldata:
  promdata:
  grafanadata:
