# db_study 기본 정의 — S0 저장소 3개(api 컨테이너는 S1 이후 코드가 생기면 추가)
# 정본: docs/04_architecture/03_execution_topology.md(서비스 · 포트 · 볼륨 · CPU 가중 · cpuset)
#       docs/09_tech_stack/03_data_infra.md(버전 고정표 · 설정 파일 · healthcheck)
# 프로파일(메모리 상한 · 프로파일별 설정)은 덮어쓰기 파일 하나로 고른다:
#   docker compose --env-file .env -f infra/compose/compose.yml -f infra/compose/compose.dev.yml up -d
name: db_study

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD 필요}
      POSTGRES_DB: plc
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    # 애플리케이션 계정(app_rw)은 migrate가 만든다 — 그 전까지는 관리자 계정으로 확인한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plc"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpu_shares: 1024
    cpuset: "9-10"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.10.6
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD 필요}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - chdata:/var/lib/clickhouse
      - ../clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ../clickhouse/config.d/server.xml:/etc/clickhouse-server/config.d/server.xml:ro
      - ../clickhouse/config.d/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
      - ../clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9363:9363"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    cpu_shares: 2048
    cpuset: "5-8"

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # 비밀번호는 설정 파일이 아니라 기동 인자로 주입한다 · maxmemory는 프로파일 덮어쓰기 파일이 command 전체로 준다
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 필요}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      # 호스트 쪽만 6380 — 이 머신의 호스트 redis-server가 6379를 쓴다(충돌 시 호스트 포트만 바꾼다 · 04_architecture/03)
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpu_shares: 512
    cpuset: "0-4"

volumes:
  pgdata:
  chdata:
  redisdata:
