# db_study PostgreSQL 공통 설정 — 메모리 계열 4값은 프로파일 포함 파일(profile.conf)이 덮어쓴다
# 정본: docs/05_data_stores/01_postgresql_schema.md §튜닝 파라미터 · docs/09_tech_stack/03_data_infra.md §PostgreSQL 확장과 설정 파일

listen_addresses = '*'
max_connections = 100                 # 05_data_stores/02 §커넥션(ADR-19)

# 선적재 — pg_partman 백그라운드 워커 · TimescaleDB는 공식 이미지에 없어 파생 이미지(infra/postgres/Dockerfile)로 더한다.
# pg_partman — 마이그레이션 004가 대조군 일 파티션을 만들 때 쓴다(009가 hypertable로 바꾼 뒤엔 관리 대상 없음) · TimescaleDB — 비교 사본 hypertable · 열 압축(ADR-32 · 009)
shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_partman_bgw,timescaledb'
# TimescaleDB — 원격 보고 끔(로컬 전용 · 빌드 기본값도 off) · 작업 워커(보존 정책) 4 — 워커 총량은 3 + 작업 4 + 병렬 쿼리 8 + partman 1 = 16
timescaledb.telemetry_level = off
timescaledb.max_background_workers = 4
max_worker_processes = 16
# pg_partman 백그라운드 워커 — 미리 만들기 · 보존 유지 작업(09_tech_stack/03 §pg_partman · 주기 1시간 · 파티션 소유자 app_owner)
pg_partman_bgw.dbname = 'plc'
pg_partman_bgw.interval = 3600
pg_partman_bgw.role = 'app_owner'
pg_stat_statements.track = all
# auto_explain 문턱은 설계에 값이 없다 — 로드만 하고 끈 상태(-1)로 둔다
auto_explain.log_min_duration = -1

# WAL · 체크포인트 · 플래너
wal_compression = zstd
checkpoint_timeout = 15min
# 직접 비교 넣기(초당 16만 행 COPY)에서 1 GB 기본값은 WAL로 20초마다 체크포인트를 일으켜 그 순간 COPY가 시간 제한(창 폭의 절반)을 넘겨
# 묶음이 통째로 빠졌다(2026-10-12 · 사흘치 넣기에서 묶음 7개) — 체크포인트를 시간(15분) 쪽으로 미룬다
max_wal_size = 4GB
random_page_cost = 1.1
# 병렬 질의 — 한 질의가 쓰는 프로세스 = 리더 1 + 작업자 3 = 4코어(cpuset 9-12 · ClickHouse max_threads 4와 같다)
max_parallel_workers_per_gather = 3

# 시간대 — DB 처리 시간대 UTC(ADR-27 · 월 · 일 파티션 경계 계산이 세션 시간대를 따른다 · DB 기본값은 migrate 관리자 단계가 같은 UTC로 맞춘다)
timezone = 'UTC'
log_timezone = 'UTC'

# 프로파일별 메모리 값(shared_buffers · effective_cache_size · work_mem · maintenance_work_mem)
include_if_exists = '/etc/postgresql/profile.conf'
