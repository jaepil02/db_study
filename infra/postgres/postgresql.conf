# db_study PostgreSQL 공통 설정 — 메모리 계열 4값은 프로파일 포함 파일(profile.conf)이 덮어쓴다
# 정본: docs/05_data_stores/01_postgresql_schema.md §튜닝 파라미터 · docs/09_tech_stack/03_data_infra.md §PostgreSQL 확장과 설정 파일

listen_addresses = '*'
max_connections = 100                 # 05_data_stores/02 §커넥션(ADR-19)

# 선적재 — pg_partman 백그라운드 워커는 공식 이미지에 확장이 없어 S0에서 뺀다.
# alarm_event 월 파티션이 필요한 단계(마이그레이션 004)에서 파생 이미지로 추가한다.
shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_partman_bgw'
# pg_partman 백그라운드 워커 — 미리 만들기 · 보존 유지 작업(09_tech_stack/03 §pg_partman · 주기 1시간 · 파티션 소유자 app_owner)
pg_partman_bgw.dbname = 'plc'
pg_partman_bgw.interval = 3600
pg_partman_bgw.role = 'app_owner'
pg_stat_statements.track = all
# auto_explain 문턱은 설계에 값이 없다 — 로드만 하고 끈 상태(-1)로 둔다
auto_explain.log_min_duration = -1

# WAL · 체크포인트 · 플래너
wal_compression = zstd
checkpoint_timeout = 15min
random_page_cost = 1.1

# 시간대 — 달력 경계 시간대 Asia/Seoul(월 파티션 경계 계산이 세션 시간대를 따른다)
timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'

# 프로파일별 메모리 값(shared_buffers · effective_cache_size · work_mem · maintenance_work_mem)
include_if_exists = '/etc/postgresql/profile.conf'
