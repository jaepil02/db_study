# observability 프로파일 — Grafana 대시보드 파일 프로비저닝(정본 docs/09_tech_stack/03_data_infra.md §구성원 설정)
# 대시보드 정의는 저장소 파일이 정본이다 — 화면에서 고친 내용은 저장되지 않는다(커밋 해시와 대시보드 정의를 묶는다)
apiVersion: 1

providers:
  - name: db_study
    orgId: 1
    folder: db_study
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      # compose 마운트 ../observability/grafana/dashboards → /var/lib/grafana/dashboards(읽기 전용)
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
