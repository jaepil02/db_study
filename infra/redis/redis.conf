# db_study Redis 공통 설정 — 정본 docs/09_tech_stack/03_data_infra.md §Redis 설정 파일 · docs/05_data_stores/06_redis_memory.md
# maxmemory는 프로파일 덮어쓰기 파일이, requirepass는 기동 인자가 준다(설정 파일에 비밀을 쓰지 않는다)

bind * -::*
protected-mode yes
port 6379
dir /data

# TTL이 있는 캐시 계열만 축출 — 봉인 계열(stream · rt · alarm)은 TTL이 없어 축출되지 않는다(ADR-05)
maxmemory-policy volatile-lru

# 재기동 시 미소비 Stream 엔트리 · PEL 보존
appendonly yes
appendfsync everysec

# Pub/Sub 출력 버퍼 한도 — 명시 값 필수 · 값은 S4에서 소켓 송신 대기량 한도와 함께 확정한다.
# 확정 전 잠정값으로 기본값과 같은 값을 명시한다.
client-output-buffer-limit pubsub 32mb 8mb 60

# 금지 명령 — KEYS 금지(단일 인스턴스에서 Stream 소비까지 멈춘다) · SCAN + COUNT만 쓴다
rename-command KEYS ""
